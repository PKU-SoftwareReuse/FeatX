name: featx-merge-dev

services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql.Dockerfile
      network: host
    image: featx-merge-dev-mysql:hostnet
    network_mode: host
    command:
      - --port=3307
      - --bind-address=127.0.0.1
      - --mysqlx=0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-featx_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lotm}
      MYSQL_USER: ${MYSQL_USER:-featx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-featx}
    volumes:
      - featx-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3307 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    image: featx-merge-dev-backend:hostnet
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: ${BACKEND_PORT:-28001}
      LTM_REPO_PATH: /workspace/repos
      LOTM_REPO_PATH: /workspace/repos
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3307/${MYSQL_DATABASE:-lotm}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-featx}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-featx}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-100MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-100MB}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_MODEL: ${LLM_API_MODEL:-deepseek-v4-pro}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_MODEL: ${OPENAI_API_MODEL:-deepseek-v4-pro}
      SENTENCE_TRANSFORMER_MODEL: ${SENTENCE_TRANSFORMER_MODEL:-/app/models/sentence-transformers/all-mpnet-base-v2}
      PYTHON_SENTENCE_TRANSFORMER_MODEL: ${PYTHON_SENTENCE_TRANSFORMER_MODEL:-/app/models/sentence-transformers/all-mpnet-base-v2}
      CODET5_MODEL: ${CODET5_MODEL:-/app/models/transformers/Salesforce/codet5-base-multi-sum}
      PYTHON_CODET5_MODEL: ${PYTHON_CODET5_MODEL:-/app/models/transformers/Salesforce/codet5-base-multi-sum}
      FOCUSGRAPH_TOP_K_FEATURES: ${FOCUSGRAPH_TOP_K_FEATURES:-3}
      FOCUSGRAPH_TOP_K_NODES: ${FOCUSGRAPH_TOP_K_NODES:-15}
      FOCUSGRAPH_EMBEDDING_MODEL: ${FOCUSGRAPH_EMBEDDING_MODEL:-/app/models/sentence-transformers/all-mpnet-base-v2}
      FOCUSGRAPH_FEATURE_EMBEDDING_MODEL: ${FOCUSGRAPH_FEATURE_EMBEDDING_MODEL:-/app/models/sentence-transformers/all-MiniLM-L6-v2}
      FOCUSGRAPH_GRAPH_EMBEDDING_BACKEND: ${FOCUSGRAPH_GRAPH_EMBEDDING_BACKEND:-bge-code}
      FOCUSGRAPH_GRAPH_EMBEDDING_MODEL: ${FOCUSGRAPH_GRAPH_EMBEDDING_MODEL:-/app/models/sentence-transformers/BAAI/bge-code-v1}
      FOCUSGRAPH_GRAPH_EMBEDDING_BATCH_SIZE: ${FOCUSGRAPH_GRAPH_EMBEDDING_BATCH_SIZE:-16}
      FOCUSGRAPH_BGE_MAX_SEQ_LENGTH: ${FOCUSGRAPH_BGE_MAX_SEQ_LENGTH:-4096}
      REPOSUMMARY_GENERATE_DESCRIPTION: ${REPOSUMMARY_GENERATE_DESCRIPTION:-true}
      REPOSUMMARY_LLM_TIMEOUT_SECONDS: ${REPOSUMMARY_LLM_TIMEOUT_SECONDS:-20}
      REPOSUMMARY_PYTHON_LLM_MAX_WORKERS: ${REPOSUMMARY_PYTHON_LLM_MAX_WORKERS:-4}
      REPOSUMMARY_LLM_MAX_TOKENS: ${REPOSUMMARY_LLM_MAX_TOKENS:-}
      REPOSUMMARY_LLM_RETRY_ATTEMPTS: ${REPOSUMMARY_LLM_RETRY_ATTEMPTS:-2}
      REPOSUMMARY_DESCRIPTION_PROGRESS_INTERVAL_SECONDS: ${REPOSUMMARY_DESCRIPTION_PROGRESS_INTERVAL_SECONDS:-10}
      REPOSUMMARY_EMBEDDING_ALLOW_DOWNLOAD: ${REPOSUMMARY_EMBEDDING_ALLOW_DOWNLOAD:-false}
      GIT_PROXY_HOST: ${GIT_PROXY_HOST:-127.0.0.1}
      GIT_PROXY_PORT: ${GIT_PROXY_PORT:-}
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_NAME: ${MYSQL_DATABASE:-lotm}
      DB_USER: ${MYSQL_USER:-featx}
      DB_PASSWORD: ${MYSQL_PASSWORD:-featx}
      REPOSUMMARY_PYTHON: /opt/reposummary-venv/bin/python
      REPOSUMMARY_DIR: /app/RepoSummary
      LOMBOK_JAR: /app/Backend/tools/lombok-1.18.36.jar
    volumes:
      - featx-repos:/workspace/repos
      - featx-reposummary-output:/app/RepoSummary/output
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.hostnet.Dockerfile
      network: host
      args:
        REACT_APP_API_BASE_URL: /api
    image: featx-merge-dev-frontend:hostnet
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  featx-mysql-data:
  featx-repos:
  featx-reposummary-output:
