# Default backend configuration.
# Docker Compose overrides these values through environment variables from the
# top-level .env file. For manual deployment, edit this file or export the same
# environment variables before starting the backend.

spring.application.name=FeatX
server.port=${SERVER_PORT:8080}
server.error.include-message=always

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100MB}

ltm.repo_path=${LTM_REPO_PATH:/workspace/repos}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lotm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:featx}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:featx}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Repair summarized repositories whose persistent indexes predate cache warmup.
# The scan runs after startup on a daemon thread and never blocks project selection.
featx.index-backfill.enabled=${FEATX_INDEX_BACKFILL_ENABLED:true}

llm.api.url=${LLM_API_URL:https://api.deepseek.com}
llm.api.key=${LLM_API_KEY:}

# Persist every Agent prompt, raw model response, and per-run token summary.
agent.logs.enabled=${AGENT_LOGS_ENABLED:true}
agent.logs.directory=${AGENT_LOG_DIR:logs/agent-runs}
