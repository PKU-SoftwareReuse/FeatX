# Manual deployment template.
# Docker Compose users should configure the top-level .env file instead; the
# Compose file supplies database, repository-cache, and LLM settings to the
# backend container.

spring.application.name=FeatX
server.port=8080
server.error.include-message=always

# LTMConfig
ltm.repo_path=/path/to/featx/repos


# MySQL配置
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lotm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=featx
spring.datasource.password=featx
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# JPA 配置
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# LLM 配置
llm.api.url=https://api.deepseek.com
llm.api.key=
